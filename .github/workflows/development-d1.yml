name: Isolated development D1
on:
  push:
    branches: ['dev/**']
    paths:
      - 'cloudflare/**'
      - 'scripts/check-development-d1.mjs'
      - 'scripts/check-development-ledger-migration.mjs'
      - 'scripts/check-development-worker.mjs'
      - 'scripts/check-development-diagnostics.mjs'
      - 'scripts/check-monitoring-stand.mjs'
      - 'tests/fixtures/monitoring-stand-network.mjs'
      - 'tests/fixtures/development-diagnostics-driver.mjs'
      - 'tests/fixtures/worker-observation.sql'
      - '.github/workflows/development-d1.yml'
permissions:
  contents: read
jobs:
  local-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/dca-miniflare" --no-audit --no-fund --save-exact miniflare@4.20260730.0
      - run: NODE_PATH="$RUNNER_TEMP/dca-miniflare/node_modules" node scripts/check-development-d1.mjs
      - run: NODE_PATH="$RUNNER_TEMP/dca-miniflare/node_modules" node scripts/check-development-worker.mjs
      - run: NODE_PATH="$RUNNER_TEMP/dca-miniflare/node_modules" node scripts/check-development-diagnostics.mjs
      - run: NODE_PATH="$RUNNER_TEMP/dca-miniflare/node_modules" node scripts/check-monitoring-stand.mjs
      - run: NODE_PATH="$RUNNER_TEMP/dca-miniflare/node_modules" node scripts/check-development-ledger-migration.mjs
