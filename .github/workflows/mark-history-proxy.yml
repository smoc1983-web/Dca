name: Historical mark risk proxy
on:
  push:
    branches: ['dev/dca800-foundation']
    paths:
      - 'scripts/prepare-mark-history.mjs'
      - 'scripts/mark-history-proxy.mjs'
      - '.github/workflows/mark-history-proxy.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [ADAUSDT, ATOMUSDT, BTCUSDT, DOGEUSDT, DOTUSDT, LDOUSDT, LINKUSDT, TRXUSDT, UNIUSDT, XRPUSDT, ZECUSDT]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/prepare-mark-history.mjs ${{ matrix.symbol }} ${{ matrix.symbol }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: mark-data-${{ matrix.symbol }}
          path: ${{ matrix.symbol }}.json
          retention-days: 30
          if-no-files-found: error
  compare:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: mark-data-*
          merge-multiple: true
          path: mark-data
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45875049345
          pattern: long-data-*
          merge-multiple: true
          path: long-data
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45875049345
          name: long-report-5-2
          path: baseline
      - run: node --max-old-space-size=5120 scripts/mark-history-proxy.mjs long-data mark-data baseline/report-5-2.json mark-proxy.json
      - uses: actions/upload-artifact@v4
        with:
          name: mark-risk-proxy
          path: mark-proxy.json
          retention-days: 30
          if-no-files-found: error
