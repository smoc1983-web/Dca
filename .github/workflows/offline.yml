name: Offline checks
on:
  push:
    branches:
      - 'dev/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baseline core tests
        run: node --test tests/core.test.mjs
      - name: Syntax and watchlist
        run: npm run check
      - name: All offline tests
        run: npm test
