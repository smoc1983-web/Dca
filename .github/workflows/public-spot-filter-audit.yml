name: Public spot minimum order audit
on:
  push:
    branches: ['dev/dca800-foundation']
    paths:
      - 'scripts/spot-filter-audit.mjs'
      - 'scripts/fetch-spot-filter-audit.mjs'
      - '.github/workflows/public-spot-filter-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fetch-spot-filter-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: public-spot-filter-audit
          path: spot-filter-audit.json
          if-no-files-found: error
          retention-days: 30
